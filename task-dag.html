const n = D.ids.length, S = D.status, N = CFG.statusNames, C = CFG.statusColors, SYM = CFG.symbols;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function hover(i) {

    N[S[i]] + " · attempts " + D.attempts[i] + " · layer " + D.rank[i],

const baseX = [], baseY = [];

  const d = D.edges[k], c = D.edges[k + 1];
  baseX.push(D.x[d], D.x[c], null); baseY.push(D.y[d], D.y[c], null);
}

  {x: baseX, y: baseY, mode: "lines", type: "scattergl", hoverinfo: "skip",
   showlegend: false, line: {color: CFG.edgeColor, width: CFG.edgeWidth}},
  {x: [], y: [], mode: "lines", type: "scattergl", hoverinfo: "skip",
   showlegend: false, line: {color: "#7c3aed", width: 1.5}},
  {x: [], y: [], mode: "markers", type: "scattergl", hoverinfo: "text",
   showlegend: false, marker: {size: 10, color: "#7c3aed",
   line: {width: 1.2, color: "#fff"}}, text: []},
  {x: [], y: [], mode: "lines", type: "scattergl", hoverinfo: "skip",
   showlegend: false, line: {color: "#f97316", width: 1.1}},
  {x: [], y: [], mode: "markers", type: "scattergl", hoverinfo: "text",

  const symbols = CFG.mode === "radial"

             line: {width: 0.5, color: "rgba(255,255,255,0.85)"}},
    text: g.nodes.map(hover), hovertemplate: "%{text}<extra></extra>",

  margin: {l: 8, r: 8, t: 8, b: 8}, showlegend: true, hovermode: "closest",
  dragmode: "pan", paper_bgcolor: "#fff", plot_bgcolor: "#fff",

  scrollZoom: true, modeBarButtonsToRemove: ["lasso2d", "select2d"]});

// ------------------------------------------------------------- interaction
let pinned = null;
function nodeAt(p) { const t = traceNodes[p.curveNumber]; return t ? t[p.pointIndex] : null; }
function setHL(nodes, pairs, color, traceEdge, traceNode) {
  const ex = [], ey = [];
  pairs.forEach(([a, b]) => { ex.push(D.x[a], D.x[b], null); ey.push(D.y[a], D.y[b], null); });
  Plotly.restyle(gd, {x: [ex], y: [ey], "line.color": [color]}, [traceEdge]);
  Plotly.restyle(gd, {
    x: [nodes.map(i => D.x[i])], y: [nodes.map(i => D.y[i])],
    "marker.color": [color], text: [nodes.map(hover)],
  }, [traceNode]);
}
function clearHL() {
  Plotly.restyle(gd, {x: [[]], y: [[]]}, [1, 3]);
  Plotly.restyle(gd, {x: [[]], y: [[]], text: [[]]}, [2, 4]);
}
function dimTo(keep) {
  groups.forEach((g, gi) => {
    const op = g.nodes.map(i => keep === null || keep.has(i) ? 0.92 : 0.10);
    Plotly.restyle(gd, {"marker.opacity": [op]}, [G0 + gi]);
  });
}
function bft(i, next, cap) {

      if (!seen.has(w)) { seen.add(w); edgePairs.push([w, v]); queue.push(w); }
    }

window.pin = function (i) {

  succs[i].forEach(c => { keep.add(c); pairs.push([i, c]); });
  setHL([...keep], pairs, "#7c3aed", 1, 2);

  dimTo(keep);
  renderSide(i);
};
function renderSide(i) {

    `<span class="chip" onclick="pin(${j})">${esc(D.ids[j])}</span>`).join("") +
    (list.length > 30 ? `<span class="muted"> +${list.length - 30} more</span>` : "");
  const st = N[S[i]];
  side.innerHTML = `
    <div class="id">${esc(D.ids[i])}</div>
    <div class="title">${esc(D.titles[i])}</div>
    <div><span class="pill" style="background:${C[st]}">${st}</span>
      <span class="muted"> · cluster ${esc(CFG.communityNames[D.comm[i]])}</span></div>
    <table>
      <tr><td>layer</td><td>${D.rank[i]} / ${CFG.maxrank}</td></tr>
      <tr><td>attempts</td><td>${D.attempts[i]}</td></tr>
      <tr><td>dependencies</td><td>${D.ndeps[i]}</td></tr>
      <tr><td>consumers</td><td>${D.ncons[i]}</td></tr>
      ${D.worker[i] ? `<tr><td>worker</td><td>${esc(D.worker[i])}</td></tr>` : ""}
      ${D.accepted[i] ? `<tr><td>accepted</td><td>${esc(D.accepted[i].slice(0, 18))}…</td></tr>` : ""}
    </table>
    <div class="actions">
      <button class="primary" onclick="showAnc()">↑ prerequisites</button>
      <button onclick="showDesc()">↓ consumers</button>
      <button onclick="clearAll()">clear</button>
    </div>
    <h2>Depends on (${D.ndeps[i]})</h2><div>${D.ndeps[i] ? chips(preds[i]) : '<span class="muted">nothing</span>'}</div>
    <h2>Consumers (${D.ncons[i]})</h2><div>${D.ncons[i] ? chips(succs[i]) : '<span class="muted">nothing</span>'}</div>`;
}
window.showAnc = function () {
  if (pinned === null) return;
  const r = bft(pinned, preds, 1200);
  setHL(r.nodes, r.edges, "#f97316", 3, 4);
  dimTo(new Set(r.nodes));
};
window.showDesc = function () {
  if (pinned === null) return;

};
window.clearAll = function () {
  pinned = null; clearHL(); dimTo(null);

};
gd.on("plotly_click", e => { const i = nodeAt(e.points[0]); if (i !== null) pin(i); });

  const i = nodeAt(e.points[0]);
  if (i !== null && pinned === null) renderSide(i);
});
document.getElementById("reset").onclick = () => {
  Plotly.relayout(gd, {"xaxis.autorange": true, "yaxis.autorange": true});
  clearAll();
};
document.getElementById("ids").innerHTML = D.ids.map(i => `<option value="${esc(i)}">`).join("");
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const v = e.target.value.trim();
  let i = D.ids.indexOf(v);
  if (i < 0) i = D.ids.findIndex(id => id.startsWith(v));
  if (i >= 0) {
    pin(i);
    const r = CFG.focusR;
    Plotly.relayout(gd, {"xaxis.range": [D.x[i] - r, D.x[i] + r],
                         "yaxis.range": [D.y[i] - r, D.y[i] + r]});
  }
});
document.getElementById("legend").innerHTML = CFG.legend.map(l =>
  l.color
    ? `<span class="item"><span style="display:inline-block;width:10px;height:10px;border-radius:${l.round ? "50%" : "2px"};background:${l.color};margin-right:5px"></span>${l.label}</span>`
    : `<span class="item">${l.label}</span>`).join("");

clearAll();
</script>
